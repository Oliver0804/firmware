; The 1.0 release of the TBEAM board 
[env:tbeam]
extends = esp32_base
board = ttgo-t-beam
board_level = pr
board_check = true
lib_deps =
  ${esp32_base.lib_deps}
build_flags = 
  ${esp32_base.build_flags}
  -D TBEAM_V10
  ; 兩者同開：SwWatchScanModule 用單一 scanner 同時收 sw_watch 廣播 + 主動連 Garmin
  -D SWWATCH_SCAN
  -D BLE_HRM_CONNECT
  ; --- Flash 裁剪（Tier 1：安全，不影響核心訊息/藍牙/GPS/螢幕）---
  -D MESHTASTIC_EXCLUDE_WEBSERVER
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER
  -D MESHTASTIC_EXCLUDE_STOREFORWARD
  -D MESHTASTIC_EXCLUDE_RANGETEST
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR
  -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE
  -D MESHTASTIC_EXCLUDE_ATAK
  -D MESHTASTIC_EXCLUDE_DROPZONE
  ; --- Tier 2：關閉網路功能（不上網/不用 MQTT）---
  -D MESHTASTIC_EXCLUDE_WIFI
  -D MESHTASTIC_EXCLUDE_MQTT
  -I variants/esp32/tbeam
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
upload_speed = 460800
